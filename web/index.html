<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>六娃</title>
    <script>
      if (window.cockpit) document.documentElement.classList.add("liuwa-host");
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="liuwa-page is-empty">
    <div class="liuwa-orb">
      <header class="liuwa-brand">
        <span class="liuwa-mark" aria-hidden="true">六</span>
        <div class="liuwa-name">
          <h1>六娃</h1>
          <p class="liuwa-kicker">隐身</p>
        </div>
      </header>

      <section class="liuwa-thread" id="liuwaThread" aria-live="polite" aria-relevant="additions text">
        <div class="liuwa-idle" id="liuwaIdle">
          <p>截当前屏幕，发给设置里的模型。</p>
        </div>
      </section>

      <footer class="liuwa-dock">
        <div class="liuwa-shots" id="liuwaShots" hidden></div>
        <label class="liuwa-note" for="liuwaNote">
          <span>补充一句</span>
          <textarea id="liuwaNote" rows="1" placeholder="可空。截好几张再发送。"></textarea>
        </label>
        <div class="liuwa-keys" id="liuwaKeys">
          <span><kbd id="hintCapture">⌘⇧Y</kbd> 全屏截图</span>
          <span><kbd id="hintSend">⌘⇧Enter</kbd> 发送</span>
          <span><kbd id="hintShow">⌘⇧D</kbd> 展示</span>
          <span><kbd id="hintHide">⌘⇧H</kbd> 隐藏</span>
          <span><kbd id="hintQuit">⌘⇧Q</kbd> 退出</span>
        </div>
        <p class="liuwa-status" id="liuwaStatus" role="status"></p>
        <input id="liuwaFiles" type="file" accept="image/*" multiple hidden />
      </footer>
    </div>
    <script type="module" src="modules/home.js"></script>
  </body>
</html>
