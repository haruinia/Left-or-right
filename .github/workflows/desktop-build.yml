name: Native desktop builds

on:
  workflow_dispatch:
    inputs:
      windows_runtime_url:
        description: 'HTTPS ZIP of the custom taskbar-protected Windows Electron runtime'
        required: true
        type: string
      windows_runtime_sha256:
        description: 'SHA-256 of the custom runtime ZIP'
        required: true
        type: string

permissions:
  contents: read

jobs:
  taskbar-regression:
    name: Native taskbar policy regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the pinned native patch
        run: python scripts/prepare_electron_taskbar.py --source output/electron-source/electron --download
      - name: Compile and exercise the actual patched native methods
        run: python tests/test_electron_taskbar_native.py --cxx g++ -v
      - name: Check build environment isolation
        run: python tests/test_electron_build_tools.py -v
      - name: Check application window and packaging contracts
        run: node --test tests/test_taskbar_runtime.mjs tests/test_error_window.mjs tests/test_settings_window.mjs tests/test_capture_displays.mjs tests/test_window_visibility.mjs tests/test_desktop_packaging.mjs tests/test_desktop_backend.mjs
  package:
    needs: taskbar-regression
    name: ${{ matrix.os }} native package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-x64
            installers: desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: macos-native
            installers: desktop/dist/*.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python build dependencies
        run: python -m pip install -e ".[desktop,dev]"
      - name: Install Electron build dependencies
        run: npm --prefix desktop ci
      - name: Prepare the custom Windows Electron runtime
        if: runner.os == 'Windows'
        shell: python
        env:
          RUNTIME_URL: ${{ inputs.windows_runtime_url }}
          RUNTIME_SHA256: ${{ inputs.windows_runtime_sha256 }}
        run: |
          import hashlib, os, pathlib, re, urllib.parse, urllib.request, zipfile
          url = os.environ['RUNTIME_URL']
          expected = os.environ['RUNTIME_SHA256'].lower()
          if urllib.parse.urlparse(url).scheme != 'https' or not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise RuntimeError('A custom Electron HTTPS ZIP and its SHA-256 are required')
          root = pathlib.Path('output/ci-electron-runtime').resolve()
          root.mkdir(parents=True, exist_ok=True)
          archive = root / 'runtime.zip'
          urllib.request.urlretrieve(url, archive)
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise RuntimeError('Custom runtime ZIP checksum mismatch')
          destination = root / 'runtime'
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  target = (destination / member.filename).resolve()
                  if not target.is_relative_to(destination):
                      raise RuntimeError('Unsafe path in custom runtime archive')
              bundle.extractall(destination)
          if not (destination / 'electron.exe').is_file():
              raise RuntimeError('The custom runtime ZIP must contain electron.exe at its root')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ZUOYOU_ELECTRON_DIST={destination}\n')
      - name: Test packaging and local-service startup contracts
        run: node --test tests/test_desktop_backend.mjs tests/test_desktop_packaging.mjs
      - name: Test Python entry points
        run: python -m pytest tests/test_desktop_packaging.py tests/test_script_help.py tests/test_config.py -q
      - name: Build for the runner's native operating system
        run: npm --prefix desktop run ${{ matrix.script }}
      - name: Verify the packaged service without an external Python runtime
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          filename = 'left-or-right-gateway.exe' if sys.platform == 'win32' else 'left-or-right-gateway'
          binaries = [p for p in pathlib.Path('desktop/dist').rglob(filename) if p.parent.name == 'backend' and p.parent.parent.name.lower() == 'resources']
          if len(binaries) != 1:
              raise RuntimeError('Expected one bundled native service in the packaged application')
          binary = binaries[0]
          subprocess.run([sys.executable, 'tests/smoke_desktop_bundle.py', '--binary', str(binary), '--web-root', str(binary.parent.parent / 'web')], check=True)
      - name: Verify the packaged native Ctrl helper heartbeat
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          helpers = [p for p in pathlib.Path('desktop/dist').rglob('windows-interaction.exe') if p.parent.name == 'native' and p.parent.parent.name.lower() == 'resources']
          if len(helpers) != 1:
              raise RuntimeError('Expected one native Windows modifier helper in the packaged application')
          subprocess.run([sys.executable, 'tests/smoke_windows_interaction.py', '--binary', str(helpers[0])], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: Left-or-right-${{ matrix.artifact }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 14
